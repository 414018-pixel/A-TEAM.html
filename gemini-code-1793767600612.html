<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A-Teamverse: Realtime Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #0f172a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            user-select: none; touch-action: none;
        }
        
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: none; overflow: hidden; background-color: #a8c3b5; }
        canvas { background-color: #a8c3b5; display: block; width: 100%; height: 100%; }

        /* 開場載入歡迎動畫與進度條 */
        #splash-screen {
            position: fixed; inset: 0; z-index: 200;
            background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .pulse-logo {
            animation: bounceLogo 2s infinite ease-in-out;
        }
        @keyframes bounceLogo {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 10px 20px rgba(16,185,129,0.3)); }
            50% { transform: translateY(-8px) scale(1.03); filter: drop-shadow(0 18px 30px rgba(16,185,129,0.5)); }
        }
        .progress-track {
            width: 240px; height: 8px; background: rgba(255,255,255,0.15);
            border-radius: 999px; overflow: hidden; position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }
        .progress-bar-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #34d399, #10b981);
            border-radius: 999px;
            box-shadow: 0 0 12px #34d399;
            transition: width 0.1s linear;
        }

        /* 遊戲大廳面板 */
        #intro-screen { 
            position: fixed; inset: 0; z-index: 100; 
            background: radial-gradient(circle at 50% 30%, #a8c3b5 0%, #2f4f4f 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 16px;
        }
        .intro-card { 
            background: rgba(255, 255, 255, 0.94); 
            backdrop-filter: blur(20px);
            padding: 28px 24px; 
            border-radius: 28px; 
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35); 
            display: flex; flex-direction: column; align-items: center; 
            max-width: 400px; width: 100%; 
            animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes cardPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        #name-input, #room-input { 
            padding: 12px 16px; border-radius: 14px; 
            border: 2px solid #cbd5e1; background: #f8fafc; 
            color: #1e293b; font-size: 16px; outline: none; 
            text-align: center; width: 100%; font-weight: 700;
            transition: all 0.2s ease;
        }
        #name-input:focus, #room-input:focus { 
            border-color: #10b981; background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2); 
        }
        
        .avatar-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); 
            gap: 8px; margin: 14px 0 18px; width: 100%; 
        }
        .avatar-btn { 
            font-size: 28px; background: #f8fafc; 
            border: 2px solid #e2e8f0; border-radius: 16px; 
            height: 52px; cursor: pointer; transition: all 0.15s ease; 
            display: flex; justify-content: center; align-items: center; 
        }
        .avatar-btn:active { transform: scale(0.92); }
        .avatar-btn.selected { 
            border-color: #10b981; background: #ffffff; 
            transform: scale(1.08); 
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); 
        }
        
        .action-btn { 
            width: 100%; padding: 13px; font-size: 15px; font-weight: 800; 
            color: white; border: none; border-radius: 14px; cursor: pointer; 
            transition: transform 0.15s, opacity 0.15s; display: flex; 
            justify-content: center; align-items: center; gap: 8px; 
        }
        .action-btn:active { transform: scale(0.96); opacity: 0.92; }
        .btn-single { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3); }
        .btn-create { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3); }
        .btn-join { background: linear-gradient(135deg, #0ea5e9, #0284c7); box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3); }
        
        #lobby-ui { display: none; width: 100%; text-align: center; }
        .player-tag { 
            display: inline-flex; align-items: center; gap: 6px; 
            background: #f1f5f9; border: 1.5px solid #cbd5e1; 
            border-radius: 999px; padding: 6px 14px; margin: 4px; 
            font-weight: 700; color: #334155; font-size: 14px;
        }

        /* 遊戲內 HUD */
        #ui-layer { position: absolute; top: 16px; left: 16px; pointer-events: none; z-index: 10; }
        #battle-panel { 
            position: absolute; top: 16px; right: 16px; 
            background: rgba(255, 255, 255, 0.92); border: 2px solid #98c9c6; 
            border-radius: 14px; padding: 12px; width: 180px; z-index: 9; 
            backdrop-filter: blur(8px); display: none; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }
        .vs-row { display: flex; justify-content: space-between; padding: 5px 8px; margin: 3px 0; border-radius: 6px; font-weight: 700; font-size: 13px; }
        .vs-me { background: #fef08a; color: #854d0e; }
        .vs-enemy { background: #f1f5f9; color: #334155; }

        /* 手機 360 度虛擬搖桿 (Joystick) */
        #joystick-zone {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            z-index: 80;
            display: none; /* 由 JS 依裝置環境自動啟用 */
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }
        #joystick-base {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.1) 100%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25), inset 0 2px 6px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-knob {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #ffffff, #d1fae5);
            border: 2.5px solid #10b981;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            pointer-events: none;
            transform: translate(0px, 0px);
            transition: transform 0.05s ease-out;
        }
        #joystick-zone.active #joystick-knob {
            background: linear-gradient(135deg, #a7f3d0, #34d399);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        /* 題目對話框 */
        #dialogue-box { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 92%; max-width: 560px; background: white; border-radius: 24px; 
            padding: 22px; display: none; box-shadow: 0 25px 60px -15px rgba(0,0,0,0.35); 
            z-index: 95; max-height: 85vh; overflow-y: auto; 
        }
        .vocab-pill { display: inline-flex; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 20px; padding: 4px 10px; margin-right: 6px; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #334155; }
        .tool-btn-small { margin-left: 6px; background: none; border: none; cursor: pointer; font-size: 14px; }
        .option-btn { width: 100%; padding: 14px; margin-bottom: 10px; border: 2px solid #e2e8f0; background: #ffffff; border-radius: 16px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: flex-start; color: #334155; }

        #game-over-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
        .game-over-content { background: #ffffff; padding: 40px 32px; border-radius: 28px; text-align: center; max-width: 340px; width: 90%; }
    </style>
</head>
<body>

    <!-- 1. 開場載入與歡迎動畫畫面 -->
    <div id="splash-screen">
        <div class="pulse-logo text-7xl mb-4">🏝️</div>
        <h1 class="text-3xl font-black text-white tracking-widest uppercase mb-1">A-Teamverse</h1>
        <p class="text-xs font-semibold text-emerald-300 tracking-wider mb-8">英語大冒險 • 即時連線</p>
        
        <div class="progress-track mb-3">
            <div class="progress-bar-fill" id="loading-bar"></div>
        </div>
        <p class="text-xs font-bold text-gray-400" id="loading-text">載入遊戲世界中... 0%</p>
    </div>

    <!-- 2. 登入與多人大廳 -->
    <div id="intro-screen">
        <div class="intro-card" id="login-ui">
            <div class="w-12 h-12 bg-emerald-100 rounded-2xl flex items-center justify-center text-2xl mb-2">🎮</div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">準備出發！</h1>
            <p class="text-xs mb-4 font-semibold text-gray-400">選擇角色與名稱進入小鎮</p>
            
            <input type="text" id="name-input" placeholder="輸入玩家暱稱 (例: Leo)" maxlength="10" autocomplete="off">
            <div class="avatar-grid" id="avatar-grid"></div>
            
            <div id="action-buttons" style="display: none; width: 100%;" class="space-y-3">
                <button class="action-btn btn-single" onclick="window.startSinglePlayer()">👤 單人自由探索</button>
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-3 text-gray-400 text-xs font-bold">多人競賽</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>
                <button class="action-btn btn-create" onclick="window.createRoom()">🏠 創建對戰房間</button>
                <div class="flex gap-2">
                    <input type="text" id="room-input" placeholder="4位房間碼" maxlength="4" style="text-transform: uppercase;">
                    <button class="action-btn btn-join" style="width: auto; padding: 0 20px;" onclick="window.joinRoom()">加入</button>
                </div>
            </div>
        </div>

        <div class="intro-card" id="lobby-ui">
            <h2 class="text-2xl font-black mb-1" style="color: #2e593d;">房號：<span id="display-room-id" class="text-blue-600 font-mono"></span></h2>
            <p class="text-xs font-bold mb-3 text-gray-500">等待其他冒險者加入...</p>
            <div id="lobby-players" class="flex flex-wrap justify-center mb-6 min-h-[50px]"></div>
            <button class="action-btn btn-create w-full" id="btn-start-battle" onclick="window.triggerGameStart()">🚀 開始遊戲</button>
        </div>
    </div>

    <!-- 3. 遊戲結束結算 -->
    <div id="game-over-modal">
        <div class="game-over-content">
            <div class="text-5xl mb-3">💀</div>
            <h2 class="text-3xl font-extrabold mb-1 text-red-500">GAME OVER</h2>
            <p class="text-lg mb-5 font-bold text-gray-600">最終得分：$<span id="final-score" class="text-amber-500">0</span></p>
            <button onclick="location.reload()" class="px-5 py-3 rounded-xl font-bold text-base w-full text-white bg-blue-500 active:scale-95 transition">返回主頁面</button>
        </div>
    </div>

    <!-- 4. 遊戲主畫面 -->
    <div id="game-wrapper">
        <div id="ui-layer">
            <h2 class="text-2xl font-black mb-0.5" style="color: #0f766e;">💰 $<span id="money" style="color: #b45309;">0</span></h2>
            <h3 class="text-xl" id="lives-display">❤️❤️❤️❤️❤️</h3>
        </div>

        <div id="battle-panel">
            <h3 class="text-center font-extrabold text-xs mb-1.5 border-b pb-1 text-emerald-800">⚔️ 即時戰況</h3>
            <div id="hud-players-list"></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- 360 度虛擬搖桿 -->
        <div id="joystick-zone">
            <div id="joystick-base">
                <div id="joystick-knob"></div>
            </div>
        </div>

        <!-- 題目與對話視窗 -->
        <div id="dialogue-box">
            <div class="flex justify-between items-center mb-3">
                <span id="task-title" class="text-blue-600 font-bold uppercase text-xs tracking-wider"></span>
                <button onclick="window.closeTask()" class="text-gray-400 font-bold hover:text-gray-600 text-sm">✕ 關閉</button>
            </div>
            <div class="border border-gray-100 rounded-2xl p-3.5 mb-3 bg-gray-50 relative">
                <div class="flex justify-between items-start">
                    <div class="text-lg font-bold text-gray-800 pr-10" id="npc-text"></div>
                    <div class="flex flex-col gap-1.5 absolute right-3 top-3">
                        <button class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-sm" onclick="window.speakText(window.currentQuestion.text)">🔊</button>
                        <button class="w-8 h-8 rounded-full bg-yellow-100 flex items-center justify-center text-sm" onclick="window.toggleTranslation('q-trans')">💡</button>
                    </div>
                </div>
                <div id="q-trans" class="text-blue-600 font-bold text-sm mt-2 hidden"></div>
                <hr class="my-3 border-gray-200">
                <div id="vocab-container" class="flex flex-wrap"></div>
            </div>
            <div id="options-container"></div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm'

        const supabaseUrl = 'https://zjjtgwmfnupciqzemvbm.supabase.co';
        const supabaseKey = 'sb_publishable_KMJ7xqLRQmhc15Qzh0F3Nw_Qd7j_OZy';
        const supabase = createClient(supabaseUrl, supabaseKey);

        window.playerName = "";
        window.playerEmoji = "👦";
        window.money = 0;
        window.lives = 5;
        window.currentQuestion = null;
        
        let inDialogue = false;
        let activeNPC = null;
        let roomChannel = null;
        let currentRoomId = "";
        let isMultiplayer = false;
        let otherPlayers = {};
        let joystickVector = { x: 0, y: 0 };

        // 載入歡迎動畫與進度條模擬
        function simulateLoading() {
            const bar = document.getElementById('loading-bar');
            const txt = document.getElementById('loading-text');
            const splash = document.getElementById('splash-screen');
            let progress = 0;

            const timer = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 4;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    bar.style.width = '100%';
                    txt.innerText = '準備完成！進入遊戲...';
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        splash.style.transform = 'scale(1.05)';
                        setTimeout(() => splash.style.display = 'none', 600);
                    }, 400);
                } else {
                    bar.style.width = `${progress}%`;
                    txt.innerText = `載入遊戲世界中... ${progress}%`;
                }
            }, 60);
        }
        window.addEventListener('load', simulateLoading);

        const avatars = ['👦', '👧', '🤖', '🦸', '🐼', '🧙', '🦇', '🐭', '🦊', '🐸'];
        const avatarGrid = document.getElementById('avatar-grid');
        const nameInput = document.getElementById('name-input');
        const actionBtns = document.getElementById('action-buttons');

        avatars.forEach(emoji => {
            let btn = document.createElement('div');
            btn.className = 'avatar-btn';
            btn.innerText = emoji;
            btn.onclick = () => {
                document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                window.playerEmoji = emoji;
                checkReady();
            };
            avatarGrid.appendChild(btn);
        });

        nameInput.addEventListener('input', checkReady);

        function checkReady() {
            if (nameInput.value.trim() !== "" && window.playerEmoji !== "") {
                actionBtns.style.display = 'block';
                window.playerName = nameInput.value.trim();
            } else {
                actionBtns.style.display = 'none';
            }
        }

        window.startSinglePlayer = function() {
            isMultiplayer = false;
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('game-wrapper').style.display = 'block';
            document.getElementById('battle-panel').style.display = 'none';
            startGame();
        }

        window.createRoom = function() {
            const roomId = Math.random().toString(36).substring(2, 6).toUpperCase();
            joinSupabaseRoom(roomId);
        }

        window.joinRoom = function() {
            const roomId = document.getElementById('room-input').value.trim().toUpperCase();
            if(roomId.length !== 4) return alert("請輸入 4 位英數字房間代碼");
            joinSupabaseRoom(roomId);
        }

        function joinSupabaseRoom(roomId) {
            currentRoomId = roomId;
            isMultiplayer = true;
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('lobby-ui').style.display = 'block';
            document.getElementById('display-room-id').innerText = roomId;

            roomChannel = supabase.channel(`room_${roomId}`, {
                config: {
                    presence: { key: window.playerName },
                    broadcast: { self: false }
                }
            });

            roomChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = roomChannel.presenceState();
                    const players = Object.keys(state);
                    const lobbyDiv = document.getElementById('lobby-players');
                    lobbyDiv.innerHTML = '';
                    players.forEach(pName => {
                        const tag = document.createElement('div');
                        tag.className = 'player-tag';
                        const pEmoji = state[pName][0]?.emoji || '👤'; 
                        tag.innerText = `${pEmoji} ${pName}`;
                        lobbyDiv.appendChild(tag);
                    });
                })
                .on('broadcast', { event: 'start_game' }, () => enterMultiplayerGame())
                .on('broadcast', { event: 'player_sync' }, ({ payload }) => {
                    if (!payload || !payload.name) return;
                    otherPlayers[payload.name] = {
                        x: payload.x ?? 1000,
                        y: payload.y ?? 1000,
                        emoji: payload.emoji || '👤',
                        score: payload.score ?? 0
                    };
                    updateBattleHUD();
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await roomChannel.track({ ready: true, emoji: window.playerEmoji });
                    }
                });
        }

        window.triggerGameStart = function() {
            if(roomChannel) {
                roomChannel.send({ type: 'broadcast', event: 'start_game' });
                enterMultiplayerGame();
            }
        }

        function enterMultiplayerGame() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('game-wrapper').style.display = 'block';
            document.getElementById('battle-panel').style.display = 'block';
            updateBattleHUD();
            startGame();
            setInterval(broadcastMyState, 100);
        }

        let lastBroadcastX = -1, lastBroadcastY = -1, lastBroadcastScore = -1;
        function broadcastMyState() {
            if (!isMultiplayer || !roomChannel) return;
            if (Math.abs(player.x - lastBroadcastX) > 2 || Math.abs(player.y - lastBroadcastY) > 2 || window.money !== lastBroadcastScore) {
                roomChannel.send({
                    type: 'broadcast',
                    event: 'player_sync',
                    payload: { 
                        name: window.playerName, 
                        emoji: window.playerEmoji,
                        x: player.x, 
                        y: player.y, 
                        score: window.money 
                    }
                });
                lastBroadcastX = player.x;
                lastBroadcastY = player.y;
                lastBroadcastScore = window.money;
            }
        }

        function updateBattleHUD() {
            const hudContainer = document.getElementById('hud-players-list');
            if (!hudContainer) return;
            hudContainer.innerHTML = '';

            let allFighters = [
                { name: (window.playerName || '我') + " (我)", score: window.money ?? 0, isMe: true }
            ];

            for (const [pName, pData] of Object.entries(otherPlayers)) {
                if (!pName || pName === 'undefined') continue;
                allFighters.push({ 
                    name: pName, 
                    score: pData?.score ?? 0, 
                    isMe: false 
                });
            }

            allFighters.sort((a, b) => b.score - a.score);

            allFighters.forEach(f => {
                let row = document.createElement('div');
                row.className = `vs-row ${f.isMe ? 'vs-me' : 'vs-enemy'}`;
                row.innerHTML = `<span class="truncate pr-1">${f.name}</span><span>$${f.score}</span>`;
                hudContainer.appendChild(row);
            });
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WORLD_SIZE = 2000;
        let viewport = { w: window.innerWidth, h: window.innerHeight };
        let player = { x: 1000, y: 1000, speed: 6 };
        let keys = {};
        
        const buildings = [
            { x: 300, y: 300, w: 250, h: 180, baseColor: '#dfa897', roofColor: '#ebbead', emoji: '🏥', name: 'Hospital', hasPool: true },
            { x: 1400, y: 400, w: 300, h: 200, baseColor: '#9eb8b5', roofColor: '#a8c7c3', emoji: '🏪', name: 'Supermarket', hasPool: false },
            { x: 400, y: 1400, w: 250, h: 220, baseColor: '#e3c28c', roofColor: '#f1d19d', emoji: '🏫', name: 'School', hasPool: true },
            { x: 1200, y: 1300, w: 200, h: 180, baseColor: '#a0b9a8', roofColor: '#b1ccb9', emoji: '🏦', name: 'Bank', hasPool: false },
            { x: 1020, y: 1600, w: 280, h: 180, baseColor: '#cbd5e1', roofColor: '#94a3b8', emoji: '🚉', name: 'Train Station', hasPool: false },
            { x: 1500, y: 150, w: 220, h: 200, baseColor: '#475569', roofColor: '#334155', emoji: '🏚️', name: 'Haunted House', hasPool: false }
        ];

        const roads = [
            { x: 0, y: 700, w: 2000, h: 160, isHorizontal: true }, 
            { x: 800, y: 0, w: 160, h: 2000, isHorizontal: false }
        ];

        const trees = [];
        for(let i=100; i<2000; i+=180) {
            if(i < 650 || i > 1050) { trees.push({x: i, y: 640}); trees.push({x: i, y: 920}); }
        }
        for(let j=100; j<2000; j+=180) {
            if(j < 650 || j > 1050) { trees.push({x: 740, y: j}); trees.push({x: 1020, y: j}); }
        }

        const bushes = [
            {x: 200, y: 200}, {x: 250, y: 240}, {x: 180, y: 400},
            {x: 1200, y: 200}, {x: 1250, y: 250}, {x: 1100, y: 150},
            {x: 300, y: 1800}, {x: 350, y: 1750}, {x: 450, y: 1850},
            {x: 1700, y: 1400}, {x: 1800, y: 1500}, {x: 1750, y: 1600}
        ];

        const npcList = [
            { id: 'chef', x: 400, y: 1000, emoji: '🧑‍🍳', role: 'Chef Gordon' },
            { id: 'police', x: 1100, y: 400, emoji: '👮', role: 'Officer Smith' },
            { id: 'teacher', x: 600, y: 1300, emoji: '🧑‍🏫', role: 'Teacher Amy' },
            { id: 'spidey', x: 1400, y: 1000, emoji: '🕷️', role: 'Spidey' },
            { id: 'conductor', x: 1160, y: 1750, emoji: '🧑‍✈️', role: 'Conductor Bob' },
            { id: 'ghost', x: 1600, y: 380, emoji: '👻', role: 'Ghost Boo' }
        ];

        const questionBank = {
            'chef': [
                { text: "Do you have any food allergies?", zh: "您有任何食物過敏嗎？", vocab: [{en: "food", zh: "食物"}, {en: "allergies", zh: "過敏"}], options: [{ text: "Yes, I am allergic to peanuts.", zh: "是的，我對花生過敏。", correct: true }, { text: "I like to drink water.", zh: "我喜歡喝水。", correct: false }] },
                { text: "Would you like to pay with cash or card?", zh: "您想付現金還是刷卡？", vocab: [{en: "cash", zh: "現金"}, {en: "card", zh: "卡片"}], options: [{ text: "By credit card, please.", zh: "請刷卡。", correct: true }, { text: "I want to wash hands.", zh: "我想洗手。", correct: false }] }
            ],
            'police': [
                { text: "I lost my wallet. What should I do?", zh: "我弄丟了錢包。我該怎麼辦？", vocab: [{en: "lost", zh: "遺失"}, {en: "wallet", zh: "錢包"}], options: [{ text: "Let's file a police report.", zh: "我們來填報案單吧。", correct: true }, { text: "Go to the supermarket.", zh: "去超市。", correct: false }] }
            ],
            'teacher': [
                { text: "May I go to the restroom?", zh: "我可以去洗手間嗎？", vocab: [{en: "restroom", zh: "洗手間"}], options: [{ text: "Yes, but please be quick.", zh: "可以，但請快點回來。", correct: true }, { text: "I have an apple.", zh: "我有一顆蘋果。", correct: false }] }
            ],
            'spidey': [
                { text: "My suit is torn. Do you know a good tailor?", zh: "我的戰衣破了。你知道哪裡有好的裁縫嗎？", vocab: [{en: "suit", zh: "戰衣"}], options: [{ text: "There's a clothing shop nearby.", zh: "附近有一家服飾店。", correct: true }, { text: "I want to sleep.", zh: "我想睡覺。", correct: false }] }
            ],
            'conductor': [
                { text: "You can take the express train, ___ you can take the bus.", zh: "你可以搭快車，___你可以搭公車。", vocab: [{en: "express train", zh: "快車"}], options: [{ text: "or", zh: "或者", correct: true }, { text: "yet", zh: "然而", correct: false }] }
            ],
            'ghost': [
                { text: "Trick or ___! Give me something good to eat!", zh: "不給糖就搗蛋！給我些好吃的！", vocab: [{en: "Trick", zh: "惡作劇/搗蛋"}], options: [{ text: "treat", zh: "請客/糖果", correct: true }, { text: "tree", zh: "樹", correct: false }] }
            ]
        };

        window.npcQueues = {};

        function shuffleArray(array) {
            let shuffled = array.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startGame() {
            resize();
            updateLivesDisplay();
            initVirtualJoystick();
            requestAnimationFrame(gameLoop);
        }

        function updateLivesDisplay() {
            let fullHearts = Math.max(0, window.lives);
            let emptyHearts = 5 - fullHearts;
            document.getElementById('lives-display').innerText = '❤️'.repeat(fullHearts) + '🤍'.repeat(emptyHearts);
        }

        window.addEventListener('resize', resize);
        function resize() { 
            viewport.w = canvas.width = window.innerWidth; 
            viewport.h = canvas.height = window.innerHeight; 
        }
        
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // ================= 虛擬搖桿初始化 (自動偵測手機與觸控環境) =================
        function initVirtualJoystick() {
            const zone = document.getElementById('joystick-zone');
            const base = document.getElementById('joystick-base');
            const knob = document.getElementById('joystick-knob');
            if (!zone || !base || !knob) return;

            // 只要是觸控裝置或是窄螢幕就必定啟用搖桿
            const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.innerWidth < 1024;
            if (isTouchDevice) {
                zone.style.display = 'flex';
            }

            const maxRadius = 45;
            let activeTouchId = null;

            function handleMove(clientX, clientY) {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const deltaX = clientX - centerX;
                const deltaY = clientY - centerY;
                const distance = Math.hypot(deltaX, deltaY);

                if (distance === 0) {
                    joystickVector = { x: 0, y: 0 };
                    knob.style.transform = `translate(0px, 0px)`;
                    return;
                }

                const clampedDist = Math.min(distance, maxRadius);
                const angle = Math.atan2(deltaY, deltaX);
                const knobX = Math.cos(angle) * clampedDist;
                const knobY = Math.sin(angle) * clampedDist;

                knob.style.transform = `translate(${knobX}px, ${knobY}px)`;

                const intensity = clampedDist / maxRadius;
                if (intensity > 0.08) {
                    joystickVector = {
                        x: Math.cos(angle) * intensity,
                        y: Math.sin(angle) * intensity
                    };
                } else {
                    joystickVector = { x: 0, y: 0 };
                }
            }

            function resetJoystick() {
                activeTouchId = null;
                joystickVector = { x: 0, y: 0 };
                zone.classList.remove('active');
                knob.style.transition = 'transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                knob.style.transform = `translate(0px, 0px)`;
            }

            zone.addEventListener('touchstart', (e) => {
                if (activeTouchId !== null) return;
                const touch = e.changedTouches[0];
                activeTouchId = touch.identifier;
                zone.classList.add('active');
                knob.style.transition = 'none';
                handleMove(touch.clientX, touch.clientY);
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        handleMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        break;
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        resetJoystick();
                        break;
                    }
                }
            };
            window.addEventListener('touchend', endTouch);
            window.addEventListener('touchcancel', endTouch);

            // 滑鼠除錯支援
            let isMouseDown = false;
            zone.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                zone.classList.add('active');
                knob.style.transition = 'none';
                handleMove(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                handleMove(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', () => {
                if (!isMouseDown) return;
                isMouseDown = false;
                resetJoystick();
            });
        }

        function update() {
            if (inDialogue || window.lives <= 0) return;
            let moveX = 0, moveY = 0;

            if (keys['KeyW'] || keys['ArrowUp']) moveY -= player.speed;
            if (keys['KeyS'] || keys['ArrowDown']) moveY += player.speed;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX -= player.speed;
            if (keys['KeyD'] || keys['ArrowRight']) moveX += player.speed;

            if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                moveX += joystickVector.x * player.speed;
                moveY += joystickVector.y * player.speed;
            }

            player.x = Math.max(20, Math.min(WORLD_SIZE - 20, player.x + moveX));
            player.y = Math.max(20, Math.min(WORLD_SIZE - 20, player.y + moveY));

            npcList.forEach(n => {
                if (Math.hypot(player.x - n.x, player.y - n.y) < 55) {
                    activeNPC = n;
                    openTask(n.id);
                }
            });
        }

        function drawPalmTree(ctx, x, y) {
            ctx.fillStyle = '#4a7c59'; ctx.save(); ctx.translate(x, y);
            for(let i=0; i<6; i++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.ellipse(0, 20, 5, 25, 0, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore();
        }

        function drawBush(ctx, x, y) {
            ctx.fillStyle = '#65a30d'; ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI*2); ctx.arc(x+15, y+10, 12, 0, Math.PI*2); ctx.arc(x-10, y+12, 10, 0, Math.PI*2);
            ctx.fill();
        }

        function draw() {
            let camX = Math.max(0, Math.min(WORLD_SIZE - viewport.w, player.x - viewport.w / 2));
            let camY = Math.max(0, Math.min(WORLD_SIZE - viewport.h, player.y - viewport.h / 2));

            ctx.clearRect(0, 0, viewport.w, viewport.h);
            ctx.save();
            ctx.translate(-camX, -camY);

            ctx.fillStyle = '#e5d9b6'; ctx.fillRect(WORLD_SIZE - 400, 0, 400, WORLD_SIZE);
            ctx.fillStyle = '#98c9c6'; ctx.fillRect(WORLD_SIZE - 250, 0, 250, WORLD_SIZE);
            ctx.fillStyle = '#536367'; roads.forEach(r => ctx.fillRect(r.x, r.y, r.w, r.h));
            
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.setLineDash([30, 30]);
            roads.forEach(r => {
                ctx.beginPath();
                if(r.isHorizontal) { ctx.moveTo(r.x, r.y + r.h/2); ctx.lineTo(r.x + r.w, r.y + r.h/2); } 
                else { ctx.moveTo(r.x + r.w/2, r.y); ctx.lineTo(r.x + r.w/2, r.y + r.h); }
                ctx.stroke();
            });
            ctx.setLineDash([]); 

            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            bushes.forEach(b => drawBush(ctx, b.x, b.y));

            buildings.forEach(b => {
                ctx.fillStyle = b.baseColor; ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = b.roofColor; ctx.fillRect(b.x + 10, b.y + 10, b.w - 20, b.h - 20);
                if(b.hasPool) {
                    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(b.x + b.w + 20, b.y + 20, 90, 60);
                    ctx.fillStyle = '#73b6b8'; ctx.fillRect(b.x + b.w + 25, b.y + 25, 80, 50);
                }
                ctx.font = '45px Arial'; ctx.fillText(b.emoji, b.x + b.w / 2, b.y + b.h / 2 - 10);
                ctx.font = 'bold 15px Arial'; ctx.fillStyle = 'white'; ctx.fillText(b.name, b.x + b.w / 2, b.y - 12);
            });

            trees.forEach(t => drawPalmTree(ctx, t.x, t.y));

            npcList.forEach(n => {
                ctx.font = '40px Arial'; ctx.fillText(n.emoji, n.x, n.y);
                ctx.font = 'bold 13px Arial'; ctx.fillStyle = 'rgba(0,0,0,0.6)';
                let tw = ctx.measureText(n.role).width;
                ctx.fillRect(n.x - tw/2 - 6, n.y - 40, tw + 12, 20);
                ctx.fillStyle = 'white'; ctx.fillText(n.role, n.x, n.y - 30);
            });

            if (isMultiplayer) {
                for (const [pName, pData] of Object.entries(otherPlayers)) {
                    ctx.font = '40px Arial'; ctx.fillText(pData.emoji, pData.x, pData.y);
                    ctx.font = 'bold 13px Arial'; ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    let ptw = ctx.measureText(pName).width;
                    ctx.fillRect(pData.x - ptw/2 - 6, pData.y - 40, ptw + 12, 20);
                    ctx.fillStyle = '#1e293b'; ctx.fillText(pName, pData.x, pData.y - 30);
                }
            }

            ctx.font = '42px Arial'; ctx.fillText(window.playerEmoji, player.x, player.y);
            ctx.font = 'bold 13px Arial'; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            let myTw = ctx.measureText(window.playerName).width;
            ctx.fillRect(player.x - myTw/2 - 6, player.y - 40, myTw + 12, 20);
            ctx.fillStyle = '#1e293b'; ctx.fillText(window.playerName, player.x, player.y - 30);

            ctx.restore();
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

        window.speakText = function(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        window.toggleTranslation = function(id) {
            let el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        window.closeTask = function() {
            document.getElementById('dialogue-box').style.display = 'none';
            player.y += 80; setTimeout(() => { inDialogue = false; }, 300);
        }

        function openTask(npcId) {
            inDialogue = true; keys = {};
            joystickVector = { x: 0, y: 0 };
            if (!window.npcQueues[npcId] || window.npcQueues[npcId].length === 0) {
                window.npcQueues[npcId] = shuffleArray(questionBank[npcId] || questionBank['chef']);
            }
            window.currentQuestion = window.npcQueues[npcId].pop();
            
            document.getElementById('task-title').innerText = `${activeNPC.role}'S TASK`;
            document.getElementById('npc-text').innerText = window.currentQuestion.text;
            document.getElementById('q-trans').innerText = window.currentQuestion.zh;
            document.getElementById('q-trans').style.display = 'none';

            const vCont = document.getElementById('vocab-container');
            vCont.innerHTML = '';
            if (window.currentQuestion.vocab) {
                window.currentQuestion.vocab.forEach((v, index) => {
                    let pill = document.createElement('div'); pill.className = 'vocab-pill';
                    const safeEn = v.en.replace(/'/g, "\\'");
                    pill.innerHTML = `${v.en} <button class="tool-btn-small" onclick="window.speakText('${safeEn}')">🔊</button><button class="tool-btn-small" onclick="window.toggleTranslation('v-trans-${index}')">💡</button><span id="v-trans-${index}" class="ml-2 text-blue-500 font-normal" style="display:none;">${v.zh}</span>`;
                    vCont.appendChild(pill);
                });
            }

            const optCont = document.getElementById('options-container');
            optCont.innerHTML = '';
            let shuffledOptions = shuffleArray(window.currentQuestion.options);

            shuffledOptions.forEach((opt, idx) => {
                let btn = document.createElement('div'); btn.className = 'option-btn';
                const safeOptEn = opt.text.replace(/'/g, "\\'");
                btn.innerHTML = `
                    <div class="flex-1 pr-3" onclick="window.handleAnswer(event, ${opt.correct})">
                        <div class="text-base font-semibold mb-1">${opt.text}</div>
                        <div id="opt-trans-${idx}" class="text-blue-600 font-bold mb-1 hidden text-sm">${opt.zh}</div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <button class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-sm" onclick="event.stopPropagation(); window.speakText('${safeOptEn}')">🔊</button>
                        <button class="w-8 h-8 rounded-full bg-yellow-100 flex items-center justify-center text-sm" onclick="event.stopPropagation(); window.toggleTranslation('opt-trans-${idx}')">💡</button>
                    </div>
                `;
                optCont.appendChild(btn);
            });
            document.getElementById('dialogue-box').style.display = 'block';
        }

        window.handleAnswer = function(event, isCorrect) {
            let card = event.currentTarget.closest('.option-btn');
            document.querySelectorAll('.option-btn').forEach(c => c.style.pointerEvents = 'none');

            if (isCorrect) {
                card.style.backgroundColor = '#dcfce7'; card.style.borderColor = '#22c55e'; 
                window.money += 20;
                document.getElementById('money').innerText = window.money;
                updateBattleHUD();
            } else {
                card.style.backgroundColor = '#fee2e2'; card.style.borderColor = '#ef4444'; 
                window.lives -= 1;
                updateLivesDisplay();
            }
            
            setTimeout(() => {
                document.getElementById('dialogue-box').style.display = 'none';
                player.y += 80; inDialogue = false;
                if (window.lives <= 0) {
                    document.getElementById('final-score').innerText = window.money;
                    document.getElementById('game-over-modal').style.display = 'flex';
                }
            }, 1000);
        }
    </script>
